status:
  scope: >-
    The result concerns the displayed 209-state, two-symbol machine and
    ordinary first-order PA. The two-sided corollary uses PA soundness
    and consistency in the standard natural numbers.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      framework: "OpenAI Codex"
      tool_setup: >-
        AI-assisted proof development and publication preparation, with
        Lean kernel checking of the formal derivations.

fidelity:
  divergences: >-
    The Challenge presents PA with an explicit first-order syntax and
    calculus. The Solution proves correspondence with Foundation's PA,
    including the exact halting sentence. The Challenge's two-list tape
    semantics is identified with the literal machine's tape model.

review:
  status: "self-assessed"
  notes: "The Lean statements and paper describe the same fixed machine and proof scope."

alignment:
  namespace: "PalomarPA"
  statements:
    - source: "The exact halting sentence and its negation are both unprovable in PA."
      lean: "PalomarPA.m6_two_sided_independence"
      module: "Solution"
      status: "proved"
    - source: "PA209 does not halt on the blank tape in state zero."
      lean: "PalomarPA.m6_machine_nonhalting"
      module: "Solution"
      status: "proved"

acknowledgements: "Lean 4, Mathlib, and FormalizedFormalLogic's Foundation library."
