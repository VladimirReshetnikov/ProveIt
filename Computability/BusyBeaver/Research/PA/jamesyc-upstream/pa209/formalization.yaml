    type: article
    location: "https://github.com/jamesyc/BusyBeaver/tree/1654314dd6892371ea38e488a7aa501d2aa55a0c"
    relationship: background
    note: "Earlier state bound and proof architecture."
  - title: "K230 Rocq verification"
    authors:
