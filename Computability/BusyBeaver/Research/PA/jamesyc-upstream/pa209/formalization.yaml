# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Nonhalting and PA-independence for a 209-state Turing machine"
  description: >-
    An explicit binary Turing machine with 209 working states searches for a
    contradiction in ordinary first-order Peano arithmetic. Lean proves that
    the machine runs forever from a blank tape and that PA proves neither
    the exact arithmetic halting sentence nor its negation. The proof
    connects a refutation compiler and a register-program simulation to all
    418 rows of the literal transition table.
  authors:
    - "James Chang"
  license: "MIT"
  responsible_maintainers:
    - "James Chang"

classification:
  arxiv: ["math.LO", "cs.LO"]
  msc2020: ["03F30", "03D10"]

