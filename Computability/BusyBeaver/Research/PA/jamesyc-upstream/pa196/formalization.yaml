version: "v0.4"

project:
  name: "Nonhalting and PA-independence for a 196-state Turing machine"
  description: >-
    An explicit binary Turing machine with 196 working states searches for
    a contradiction in ordinary first-order Peano arithmetic. Lean proves
    blank-tape nonhalting and that PA proves neither the exact arithmetic
    halting sentence nor its negation. A refutation compiler connects the PA
    proof predicate to the literal 392-row table. The axiom command uses
    a transposed quantifier code and a guarded equality-vacuity clause.
  authors: ["James Chang"]
  license: "MIT"
  responsible_maintainers: ["James Chang"]

classification:
  arxiv: ["math.LO", "cs.LO"]
  msc2020: ["03F30", "03D10"]

