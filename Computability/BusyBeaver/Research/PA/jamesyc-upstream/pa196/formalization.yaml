    relationship: builds-on
    note: >-
      PA196 retains shared PA syntax, coding, and engine lemmas. Intermediate
      formulas from the PA209 implication proof guided the search for PA196's
      shared restricted implication derivation.

status:
  scope: >-
    Blank-tape nonhalting and two-sided independence for the exact PA196
    table in ordinary first-order PA. The closed Lean corollaries use
    Foundation's standard-model consistency and soundness in the metatheory.
    The two intentional Challenge holes state the compared claims.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      framework: "OpenAI Codex"
      tool_setup: "AI-assisted Lean development with deterministic source generators and kernel-checked proofs."

fidelity:
  divergences: >-
    Lean verifies the simulation for the reachable gap bound of 48,
    established by startup. The arithmetic transport projects its internal
    215-slot encoding to the exact 196 working states and halt label 196.
    The Challenge uses explicit first-order syntax and two-list tape
    semantics. The Solution proves their correspondence to Foundation and
    the literal machine.

review:
  status: "self-assessed"
  notes: "Self-assessed statement alignment. Human review status is unrecorded."

alignment:
  namespace: "PalomarPA.PA196"
  statements:
    - source: "Ordinary PA proves neither exact PA196 halting nor exact PA196 nonhalting."
      lean: "PalomarPA.PA196.two_sided_independence"
      module: "PA196.Palomar.Solution"
      status: "proved"
    - source: "PA196 runs forever from state zero on a blank tape."
      lean: "PalomarPA.PA196.machine_nonhalting"
      module: "PA196.Palomar.Solution"
      status: "proved"

acknowledgements: "Lean 4, Mathlib, and FormalizedFormalLogic's Foundation library."
