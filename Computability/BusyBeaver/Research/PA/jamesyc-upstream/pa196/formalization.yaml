    type: paper
    location: "https://github.com/jamesyc/BusyBeaver/tree/69d98241a721ead20b4f0b17df9062950b40fbfe"
    relationship: background
    note: "Predecessor machine and shared tape-engine and arithmetic proof architecture."
  - title: "K230 Rocq verification"
    authors: ["Elliot Glazer"]
    location: "https://github.com/elliotglazer/k230-rocq/tree/3142e4dd980f0be12f4abb636c4ae2528afc17eb"
