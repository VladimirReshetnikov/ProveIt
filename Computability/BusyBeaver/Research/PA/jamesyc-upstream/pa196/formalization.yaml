    authors: ["James Chang"]
    type: paper
    location: "paper/pa196.pdf in this repository"
    relationship: formalizes
    note: "Companion paper presenting the machine and its independence proof."
  - title: "Nonhalting and PA-independence for a 209-state Turing machine"
