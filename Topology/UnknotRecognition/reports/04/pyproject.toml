[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unknot-reference-components"
version = "0.1.0"
description = "Exact exponential unknot reference recognizer; partial hierarchy components"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
unknot-reference = "unknot.__main__:main"

[tool.setuptools]
packages = ["unknot"]
