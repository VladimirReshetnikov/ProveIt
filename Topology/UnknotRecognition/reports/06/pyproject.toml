[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unknot-recognition-audit"
version = "0.1.0"
description = "Exact exponential unknot recognition and a hierarchy boundary-pattern subroutine"
requires-python = ">=3.9"
dependencies = []
license = {text = "MIT-0"}
readme = "README.md"

[project.scripts]
unknot = "unknot.__main__:main"

[tool.setuptools]
packages = ["unknot"]
