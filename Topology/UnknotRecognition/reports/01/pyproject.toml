[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unknot-exact-lab"
version = "0.1.0"
description = "Exact grid unknot recognition and polynomial hierarchy primitives; not a QP implementation"
requires-python = ">=3.9"
license = {text = "MIT-0"}
dependencies = []

[project.scripts]
unknot = "unknot.__main__:main"

[tool.setuptools]
packages = ["unknot"]
