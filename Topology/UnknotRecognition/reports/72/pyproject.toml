[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proveit-rooted-disc-components"
version = "0.1.0"
description = "Research kernels and independent replay for rooted disc-component assembly"
requires-python = ">=3.10"
license = {text = "MIT-0"}
dependencies = []

[project.scripts]
rooted-disc = "rooted_disc.__main__:main"

[tool.setuptools.packages.find]
include = ["rooted_disc*"]
