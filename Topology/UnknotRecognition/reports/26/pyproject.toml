[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detshadow"
version = "0.1.0"
description = "Exact marked continuation observers and singular-safe terminal determinants"
requires-python = ">=3.10"
license = {text = "MIT-0"}

[tool.setuptools]
packages = ["detshadow"]
