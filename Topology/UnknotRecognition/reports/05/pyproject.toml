[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unknot-recognition-research"
version = "0.1.0"
description = "Exact exponential unknot recognizer and partial hierarchy kernels; no QP guarantee"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
unknot-recognition = "unknot_recognition.cli:main"

[tool.setuptools.packages.find]
include = ["unknot_recognition*"]
