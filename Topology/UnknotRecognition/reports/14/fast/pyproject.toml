[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastunknot"
version = "0.4.0"
description = "Exact unknot recognition with continuation quotients and certified algebraic splitting"
requires-python = ">=3.10"
license = {text = "MIT-0"}
dependencies = []

[project.scripts]
fastunknot = "fastunknot.__main__:main"

[tool.setuptools.packages.find]
include = ["fastunknot*"]
