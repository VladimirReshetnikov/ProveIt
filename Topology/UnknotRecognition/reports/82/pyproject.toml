[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proveit-corner-kernel"
version = "0.1.0"
description = "Corner-aware marked boundary kernels for compressed surface interfaces"
requires-python = ">=3.10"
license = {text = "MIT-0"}

[tool.setuptools.packages.find]
where = ["src"]
