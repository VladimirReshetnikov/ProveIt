[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proveit-affine-orbit-profiles"
version = "0.1.0"
description = "Exact interval-weighted affine orbit profiles and sparse attachment replay"
requires-python = ">=3.10"
license = {text = "MIT-0"}

[tool.setuptools.packages.find]
where = ["src"]
