[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unknot-workbench"
version = "0.1.0"
description = "Exact exponential reference recognizer and polynomial hierarchy subroutines; not a quasi-polynomial solution"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = []

[project.scripts]
unknot-lab = "unknot_lab.__main__:main"

[tool.setuptools]
packages = ["unknot_lab"]
