[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anchored-unknot-research"
version = "0.1.0"
description = "Source-anchored primitive projection research kernel, not a complete recognizer"
requires-python = ">=3.10"
license = {text = "MIT-0"}

[tool.setuptools.packages.find]
where = ["src"]
