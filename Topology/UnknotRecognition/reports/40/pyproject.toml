[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portkh"
version = "0.1.0"
description = "Exact singular-safe homology of finite-state port-coupled binary complexes"
requires-python = ">=3.10"
license = {text = "MIT-0"}

[tool.setuptools.packages.find]
where = ["src"]
