[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastunknot"
version = "0.3.0"
description = "Exact unknot recognition: near-linear three-braid decision and a general exponential Khovanov fallback"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
fastunknot = "fastunknot.__main__:main"

[tool.setuptools.packages.find]
include = ["fastunknot*"]
