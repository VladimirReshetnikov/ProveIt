[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proveit-orbit-transfer-research"
version = "0.1.0"
description = "Exact compiled orbit transfers and selective source-profile extraction"
requires-python = ">=3.10"
license = {text = "MIT-0"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
