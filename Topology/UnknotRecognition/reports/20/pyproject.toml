[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proveit-unknot-windows"
version = "0.1.0"
description = "Certified extremal Khovanov windows and a conservative unknot probe"
requires-python = ">=3.10"
license = {text = "MIT-0"}

[project.scripts]
unknot-windows = "unknot_windows.__main__:main"

[tool.setuptools.packages.find]
include = ["unknot_windows*", "integration*"]
