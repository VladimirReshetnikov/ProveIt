[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unknotlab-reference"
version = "0.1.0"
description = "Exact exponential-time unknot recognition and implemented hierarchy components"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
unknotlab = "unknotlab.__main__:main"

[tool.setuptools]
packages = ["unknotlab"]
