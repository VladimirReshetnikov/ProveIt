[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastunknot"
version = "0.1.0"
description = "Exact unknot recognition: polynomial filters plus a scanning Khovanov backend (exponential worst case, no quasi-polynomial claim)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
fastunknot = "fastunknot.__main__:main"

[tool.setuptools.packages.find]
include = ["fastunknot*"]
