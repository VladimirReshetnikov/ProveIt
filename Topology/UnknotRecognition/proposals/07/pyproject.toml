[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastunknot-accelerated"
version = "0.2.0"
description = "Exact unknot recognition with accelerated F2 Khovanov scanning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
fastunknot = "fastunknot.__main__:main"

[tool.setuptools.packages.find]
include = ["fastunknot*"]
