[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastunknot"
version = "0.2.0"
description = "Exact unknot recognition with bounded modular filters and factorwise Khovanov homology"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT-0"}
dependencies = []

[project.scripts]
fastunknot = "fastunknot.__main__:entrypoint"

[tool.setuptools.packages.find]
include = ["fastunknot*"]
