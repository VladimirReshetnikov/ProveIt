name = "RiemannIPRA"
version = "1.0.0"
defaultTargets = ["RiemannIPRA"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "ConciseIPRA"
roots = ["ConciseIPRA.Syntax", "ConciseIPRA.Deduction", "ConciseIPRA.PR", "ConciseIPRA.Semantics"]

[[lean_lib]]
name = "RiemannIPRA"
roots = ["PacketLanguage", "PolynomialCode", "Hierarchy", "Hypotheses", "RHCounterexamples", "CompilerSemantics", "ArithmeticReading", "StandardReading", "SmokePR", "DirichletData", "ERHData", "MertensForms", "RiemannIPRA"]
